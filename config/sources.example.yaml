# Sample configuration file for real external data sources (T5b)
# Copy and adapt: cp config/sources.example.yaml config/sources.yaml

sources:
  # Mode: 'fixtures' (default, simulated deterministic data) or 'real' (external APIs)
  mode: fixtures

  # Local YAML policies path for project quality criteria
  policies_path: config/policies.yaml

  # Bounded HTTP transport socket and cooperative streaming timeouts (seconds)
  http_timeout_seconds: 30.0

  # Maximum allowed HTTP response payload bytes across streaming chunks (e.g. 10 MiB)
  http_max_response_bytes: 10485760

  # Trello board read-only integration
  trello:
    board_id: "example-board-id"
    # Never commit actual credentials; use environment variables or SecretStr
    api_key: "your-trello-api-key"
    token: "your-trello-oauth-token"
    mapping:
      pending_list_ids:
        - "list-id-todo"
      in_progress_list_ids:
        - "list-id-doing"
      completed_list_ids:
        - "list-id-done"
      blocked_labels:
        - "bloqueada"
        - "blocked"
      # Optional: cards outside these lists are excluded from progress metrics
      included_list_ids: null

  # GitHub code repository and commit diff read-only integration
  github:
    owner: "organization-or-user"
    repo: "repository-name"
    # Optional personal access token for higher rate limits and private repositories
    token: "github_pat_example"
    # Target branch used to resolve default commit tip when commit_sha is omitted
    branch: "main"
    # Full 40-character or 64-character hexadecimal commit SHA (pinned scope)
    commit_sha: null
