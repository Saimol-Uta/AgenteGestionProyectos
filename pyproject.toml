[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-gestion-proyectos"
version = "0.1.0"
description = "Prototipo funcional de agente de gestión de proyectos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
web = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
